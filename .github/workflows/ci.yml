# CI/CD del sistema MiBici (Equipo 20)
#   1. lint   : errores de sintaxis y nombres no definidos (ruff)
#   2. test   : pytest en matriz Python 3.10 / 3.11, con caché de pip
#   3. build  : imágenes api, mlflow y prep con caché de capas de BuildKit
#   4. smoke  : levanta MLflow y las tres APIs con Docker Compose y verifica que respondan
#   5. publish: en push a main publica las imágenes en GitHub Container Registry (ghcr.io)
name: CI/CD MiBici

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRO: ghcr.io

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "ruff>=0.6.0"
      # Errores que rompen la ejecución: sintaxis, comparaciones inválidas y nombres no definidos
      - run: ruff check --select E9,F63,F7,F82 --output-format=github .

  test:
    name: Pruebas (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            docker/constraints.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -c docker/constraints.txt -r requirements.txt
      # Sin datos de MiBici ni modelos en el runner: las pruebas que los necesitan se omiten
      # (skipif en conftest/deepchecks/pipeline) y corren las unitarias con datos sintéticos.
      # Se limita a tests/: proyecto_mibici/monitoring/test_evidently_registro.py es de integración
      # y requiere un servidor de Evidently Platform en :8000, que no existe en el runner.
      - name: Ejecutar pytest
        env:
          MPLBACKEND: Agg
        run: pytest tests -q -rs --junitxml=reports/pytest-${{ matrix.python-version }}.xml
      - name: Guardar resultados de pytest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-py${{ matrix.python-version }}
          path: reports/pytest-${{ matrix.python-version }}.xml

  build:
    name: Build imagen ${{ matrix.imagen }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        imagen: [api, mlflow, prep, evidently]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.imagen }}/Containerfile
          tags: mibici-${{ matrix.imagen }}:${{ github.sha }}
          # Caché de capas en GitHub Actions (act no la implementa, ahí se omite)
          cache-from: ${{ !env.ACT && format('type=gha,scope={0}', matrix.imagen) || '' }}
          cache-to: ${{ !env.ACT && format('type=gha,mode=max,scope={0}', matrix.imagen) || '' }}
          outputs: type=docker,dest=/tmp/mibici-${{ matrix.imagen }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: imagen-${{ matrix.imagen }}
          path: /tmp/mibici-${{ matrix.imagen }}.tar
          retention-days: 1

  smoke:
    name: Smoke test con Docker Compose
    needs: build
    runs-on: ubuntu-latest
    env:
      # Proyecto aparte: con act, "down -v" no toca los volúmenes del sistema local (proyecto mibici)
      COMPOSE_PROJECT_NAME: mibici-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: imagen-*
          path: /tmp/imagenes
          merge-multiple: true
      - name: Cargar imágenes construidas
        run: |
          for f in /tmp/imagenes/*.tar; do docker load -i "$f"; done
          for i in api mlflow evidently prep; do docker tag mibici-$i:${{ github.sha }} mibici-$i:latest; done
      - name: Validar docker-compose.yml
        run: docker compose -f docker/docker-compose.yml config -q
      # Se levantan MLflow y Evidently; luego se registran 3 modelos mínimos sintéticos como @champion
      # en prep (sin descargar 8.5M de viajes) para que las APIs y Locust prueben /predict real.
      - name: Levantar MLflow y Evidently
        run: docker compose -f docker/docker-compose.yml up -d --no-build --no-deps --wait mlflow evidently
      - name: Registrar modelos mínimos de prueba en MLflow
        run: |
          docker compose -f docker/docker-compose.yml run --rm --no-deps --entrypoint python prep - <<'EOF'
          import joblib, mlflow, numpy as np, pandas as pd
          from mlflow.tracking import MlflowClient
          from sklearn.cluster import KMeans
          from sklearn.dummy import DummyRegressor
          from sklearn.linear_model import LogisticRegression

          mlflow.set_tracking_uri("http://mlflow:5000")
          client = MlflowClient("http://mlflow:5000")
          rng = np.random.default_rng(42)

          df_p1 = pd.DataFrame({
              "lag_1h": rng.uniform(0, 10, 20),
              "lag_24h": rng.uniform(0, 10, 20),
              "lag_168h": rng.uniform(0, 10, 20),
              "target_hour_sin": rng.uniform(-1, 1, 20),
              "target_hour_cos": rng.uniform(-1, 1, 20),
              "target_is_weekend": rng.integers(0, 2, 20),
              "rolling_3h": rng.uniform(0, 10, 20),
              "rolling_168h": rng.uniform(0, 10, 20),
          })
          m_p1 = DummyRegressor(strategy="constant", constant=5.0).fit(df_p1, rng.uniform(0, 10, 20))

          df_p2 = pd.DataFrame({
              "hora_del_dia": rng.integers(0, 24, 20),
              "dia_semana": rng.integers(0, 7, 20),
              "fin_de_semana": rng.integers(0, 2, 20),
              "capacidad": rng.integers(12, 40, 20),
              "salidas": rng.integers(0, 15, 20),
              "llegadas": rng.integers(0, 15, 20),
              "balance_acumulado_dia": rng.integers(-10, 10, 20),
              "acumulado_relativo": rng.uniform(-1, 1, 20),
              "balance_ult_3h_relativo": rng.uniform(-1, 1, 20),
              "riesgo_vacia": rng.integers(0, 2, 20),
              "riesgo_llena": rng.integers(0, 2, 20),
          })
          y_p2 = np.array([False, True] * 10)
          m_p2 = LogisticRegression(max_iter=200).fit(df_p2, y_p2)

          df_p3 = pd.DataFrame({
              "pct_manana": rng.uniform(0, 0.3, 20),
              "pct_mediodia": rng.uniform(0, 0.3, 20),
              "pct_tarde": rng.uniform(0, 0.3, 20),
              "pct_noche": rng.uniform(0, 0.2, 20),
              "pct_fin_de_semana": rng.uniform(0, 0.5, 20),
              "duracion_media": rng.uniform(5, 30, 20),
              "viajes_dia_log": rng.uniform(0.5, 4, 20),
              "balance_neto": rng.uniform(-0.5, 0.5, 20),
          })
          m_p3 = KMeans(n_clusters=4, n_init=1, random_state=42).fit(df_p3)

          modelos = [
              ("mibici-equipo20-p1-demanda", m_p1),
              ("mibici-equipo20-p2-riesgo", m_p2),
              ("mibici-equipo20-p3-grupos", m_p3),
          ]
          mlflow.set_experiment("ci-smoke")
          for reg_name, modelo in modelos:
              with mlflow.start_run(run_name=f"smoke-{reg_name}") as run:
                  joblib.dump(modelo, "/tmp/modelo.pkl")
                  mlflow.log_artifact("/tmp/modelo.pkl", artifact_path="model")
                  try:
                      client.create_registered_model(reg_name)
                  except Exception:
                      pass
                  mv = client.create_model_version(
                      name=reg_name,
                      source=f"runs:/{run.info.run_id}/model",
                      run_id=run.info.run_id,
                  )
                  client.set_registered_model_alias(reg_name, "champion", mv.version)
          print("Modelos mínimos registrados como @champion")
          EOF
      - name: Levantar APIs
        run: docker compose -f docker/docker-compose.yml up -d --no-build --no-deps --wait api-p1 api-p2 api-p3
      # Las verificaciones corren dentro de cada contenedor (docker exec): funcionan igual en
      # GitHub y al ejecutar el workflow en local con act, donde el runner es otro contenedor.
      - name: Verificar servicios
        run: |
          docker exec mlflow python -c "import urllib.request as u; print('mlflow /health', u.urlopen('http://localhost:5000/health', timeout=5).status)"
          docker exec evidently python -c "import urllib.request as u; print('evidently /api/version', u.urlopen('http://localhost:8000/api/version', timeout=5).status)"
          for api in api-p1 api-p2 api-p3; do
            docker exec -i $api python - <<'EOF'
          import time, urllib.request as u, os
          for intento in range(20):
              try:
                  print(os.environ["PREGUNTA"], "/docs", u.urlopen("http://localhost:8000/docs", timeout=5).status)
                  break
              except Exception:
                  time.sleep(3)
          else:
              raise SystemExit("la API no respondió en /docs")
          r = u.urlopen("http://localhost:8000/health", timeout=15)
          print(os.environ["PREGUNTA"], "/health", r.status, r.read()[:120])
          assert r.status == 200, r.status
          EOF
          done
      - name: Prueba de carga con Locust (headless 15s)
        run: |
          mkdir -p reports/locust
          chmod 777 reports/locust
          docker compose -f docker/docker-compose.yml --profile loadtest run --rm --no-deps locust \
            -f /mnt/locust/locustfile.py --headless -u 6 -r 3 -t 15s \
            --only-summary --csv /mnt/locust/reports/ci_smoke --html /mnt/locust/reports/ci_smoke.html
      - name: Guardar reporte de Locust
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-smoke-report
          path: reports/locust/ci_smoke*
      - name: Logs de los contenedores
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail 50
      - name: Bajar servicios
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  publish:
    name: Publicar imagen ${{ matrix.imagen }} en GHCR
    needs: smoke
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        imagen: [api, mlflow, prep, evidently]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: imagen-${{ matrix.imagen }}
          path: /tmp
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetar y subir
        run: |
          docker load -i /tmp/mibici-${{ matrix.imagen }}.tar
          destino=${{ env.REGISTRO }}/${GITHUB_REPOSITORY,,}/mibici-${{ matrix.imagen }}
          for tag in ${{ github.sha }} latest; do
            docker tag mibici-${{ matrix.imagen }}:${{ github.sha }} $destino:$tag
            docker push $destino:$tag
          done
